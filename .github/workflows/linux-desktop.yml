name: Validate and package Linux Desktop

on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'desktop/**'
      - 'engine/**'
      - 'protocol/**'
      - 'PKGBUILD'
      - '.github/workflows/linux-desktop.yml'
  pull_request:
    branches: [main]
    paths:
      - 'desktop/**'
      - 'engine/**'
      - 'protocol/**'
      - 'PKGBUILD'
      - '.github/workflows/linux-desktop.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test Linux desktop
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install GTK/WebKit dependencies
        run: sudo apt-get update && sudo apt-get install -y libgtk-4-dev libwebkitgtk-6.0-dev
      - uses: actions/setup-go@v7
        with:
          go-version-file: engine/go.mod
          cache-dependency-path: |
            engine/go.sum
            desktop/go.sum
      - uses: pnpm/action-setup@v6
        with:
          version: 10
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: desktop/frontend/pnpm-lock.yaml
      - name: Install Wails v3 CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-alpha2.119
      - name: Generate bindings and frontend
        run: |
          pnpm --dir desktop/frontend install --frozen-lockfile
          (cd desktop && wails3 generate bindings -clean=true -ts -i)
          pnpm --dir desktop/frontend build
      - name: Test, vet and build
        run: |
          go -C engine test ./...
          go -C engine vet ./...
          go -C desktop test ./internal/engineclient ./internal/services ./internal/platform ./internal/startup
          go -C desktop vet ./internal/engineclient ./internal/services ./internal/platform ./internal/startup
          go -C engine build -trimpath -o /tmp/hypomux-engine ./cmd/hypomux-engine
          go -C desktop build -tags production -trimpath -o /tmp/hypomux

  package:
    name: Build Arch Linux package
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Build package with makepkg
        run: |
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/workspace" \
            --workdir /workspace \
            archlinux:latest \
            bash -euxo pipefail -c '
              pacman -Syu --noconfirm --needed base-devel git go nodejs pnpm gtk4 webkitgtk-6.0 iproute2 polkit systemd sudo
              useradd --create-home builder
              echo "builder ALL=(ALL) NOPASSWD: /usr/bin/pacman" > /etc/sudoers.d/builder
              chmod 440 /etc/sudoers.d/builder
              chown -R builder:builder /workspace
              su builder -s /bin/bash -c "git clone https://aur.archlinux.org/sing-box.git /tmp/sing-box && cd /tmp/sing-box && makepkg --noconfirm --syncdeps"
              pacman -U --noconfirm /tmp/sing-box/*.pkg.tar.zst
              su builder -s /bin/bash -c "makepkg --noconfirm --cleanbuild --clean"
              mkdir -p /workspace/package
              cp /workspace/hypomux-[0-9]*-x86_64.pkg.tar.zst /workspace/package/
            '
      - name: Upload Arch package artifact
        uses: actions/upload-artifact@v4
        with:
          name: hypomux-arch-package
          path: package/*.pkg.tar.zst
          if-no-files-found: error

  release:
    name: Publish Arch package release
    needs: package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download Arch package
        uses: actions/download-artifact@v4
        with:
          name: hypomux-arch-package
          path: package
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: package/*.pkg.tar.zst
          generate_release_notes: true
